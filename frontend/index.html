<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title or 'Chatbot Ollama' }}</title>
    <link rel="icon" type="image/png" href="/image/favicon.png?v={{ range(100000) | random }}">
    <!-- Tailwind CSS avec config sombre automatique -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class'
      }
    </script>
    <!-- Init dark mode before DOM renders -->
    <script>
      (function() {
        const savedDarkMode = localStorage.getItem("darkMode");
        const isDarkMode = savedDarkMode !== null ? savedDarkMode === "true" : true;
        localStorage.setItem("darkMode", isDarkMode);
        if (isDarkMode) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <style>
      #mainNavbar {
        transition: width 0.3s ease;
        width: 15rem;
      }
      
      #mainNavbar.navbar-collapsed {
        width: 4rem;
      }
      
      #mainNavbar.navbar-collapsed [data-navbar-text],
      #mainNavbar.navbar-collapsed .navbar-section-title {
        display: none;
      }

      /* Cacher la section historique quand la navbar est fermée */
      #mainNavbar.navbar-collapsed > div:nth-child(3) {
        display: none;
      }
      
      /* Changer le padding uniquement pour la section historique (div centrale) */
      #mainNavbar.navbar-collapsed > div:nth-child(3) .px-3 {
        padding-left: 0.5rem;
        padding-right: 0.5rem;
      }
      
      #mainNavbar.navbar-collapsed button {
        justify-content: flex-start;
      }
      
      [data-navbar-text] {
        transition: opacity 0.3s ease;
      }

      /* Header icons visibility */
      .navbar-logo {
        transition: opacity 0.3s ease;
      }

      .navbar-toggle-icon {
        opacity: 0;
        transition: opacity 0.3s ease;
      }

      /* Navbar OUVERTE (state par défaut) */
      /* F1 à gauche, icône à droite visible */
      #mainNavbar:not(.navbar-collapsed) > div:first-child {
        justify-content: space-between;
      }

      #mainNavbar:not(.navbar-collapsed) .navbar-logo {
        opacity: 1;
      }

      #mainNavbar:not(.navbar-collapsed) .navbar-toggle-icon {
        opacity: 1;
      }

      /* Navbar FERMÉE */
      /* F1 et icône restent à gauche, sans mouvement */
      #mainNavbar.navbar-collapsed > div:first-child {
        justify-content: flex-start;
        position: relative;
      }

      #mainNavbar.navbar-collapsed .navbar-toggle-icon {
        position: absolute;
        left: 0.5rem;
        transform: none;
      }

      #mainNavbar.navbar-collapsed .navbar-toggle-icon:hover {
        opacity: 1;
      }

      #mainNavbar.navbar-collapsed > div:first-child:has(.navbar-toggle-icon:hover) .navbar-logo {
        opacity: 0;
      }

      /* Fixation des éléments de la navbar */
      #mainNavbar > div:first-child {
        position: sticky;
        top: 0;
        z-index: 10;
      }

      #mainNavbar > div:nth-child(2) {
        position: sticky;
        top: 4.5rem;
        z-index: 10;
      }

      #mainNavbar > div:last-child {
        position: sticky;
        bottom: 0;
        z-index: 10;
        margin-top: auto;
      }

      /* États du layout chat */
      #chatContainer.active-chat #chatBox {
        display: flex;
        flex-direction: column;
      }

      #chatContainer.active-chat #inputContainer {
        height: auto;
        padding: 1rem 1.5rem;
      }

      #chatContainer.active-chat #inputContainer h1 {
        display: none;
      }

      #chatContainer.active-chat #inputContainer > div {
        width: 100%;
        max-width: 100%;
      }

      .input-racing {
        width: 100%;
        background: linear-gradient(135deg, rgba(225,6,0,0.2), rgba(139,0,0,0.2));
        border: 2px solid #e10600;
        border-radius: 50px;
        padding: 18px 60px 18px 25px;
        color: white;
        font-size: 1em;
        outline: none;
        transition: all 0.3s;
      }

      .input-racing:hover {
        background: linear-gradient(135deg, rgba(225,6,0,0.3), rgba(139,0,0,0.3));
        border-color: #ff1e1e;
        box-shadow: 0 0 20px rgba(225,6,0,0.3);
      }

      .input-racing:focus {
        background: linear-gradient(135deg, rgba(225,6,0,0.25), rgba(139,0,0,0.25));
        border-color: #ff3333;
        box-shadow: 0 0 25px rgba(225,6,0,0.4);
      }

      .input-racing::placeholder {
        color: #0B1C2D;
        font-size: 0.95em;
        letter-spacing: 0.5px;
      }

      /* Navbar F1 Racing Style */
      .sidebar-header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 30px;
        padding-bottom: 20px;
        border-bottom: 2px solid rgba(225,6,0,0.3);
      }

      #mainNavbar.navbar-collapsed .sidebar-header {
        margin-bottom: 0;
        padding-bottom: 0;
        border-bottom: none;
      }

      .f1-logo-nav {
        font-size: 1.8em;
        flex-shrink: 0;
      }

      .brand-name {
        font-size: 1.1em;
        font-weight: 600;
        background: linear-gradient(135deg, #e10600, #ff6b00);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      #mainNavbar.navbar-collapsed .brand-name {
        display: none;
      }

      @media (prefers-color-scheme: dark) {
        #chatContainer.active-chat #inputContainer {
          border-top-color: #1e293b;
        }
      }

      /* Décalage du chat container pour laisser place à la navbar */
      #chatContainer {
        margin-left: 15rem;
        transition: margin-left 0.3s ease;
      }

      #mainNavbar.navbar-collapsed ~ #chatContainer {
        margin-left: 4rem;
      }
    </style>
  </head>
  <body class="bg-[#F5F6F8] dark:bg-[#050A10] text-[#0B1C2D] dark:text-[#E6ECF2] h-screen overflow-hidden">
    <div class="flex h-full">
      <!-- Navbar collapsible -->
      <nav id="mainNavbar" class="bg-[#F5F6F8] dark:bg-[#0C1A28] flex flex-col py-3 shadow-lg overflow-hidden fixed left-0 top-0 h-full z-50">
        <!-- Header avec toggle icon -->
        <div class="px-4 py-3 flex items-center justify-between bg-[#F5F6F8] dark:bg-[#0C1A28] relative border-b-4 border-[#E10600]">
          <!-- F1 logo - à gauche en ouvert, centré en fermé -->
          <button class="navbar-logo text-2xl hover:scale-110 transition-transform duration-200" title="Logo">🏎️</button>
          
          <!-- Icone toggle - à droite en ouvert, remplace F1 au hover en fermé -->
          <button class="navbar-toggle-icon items-center text-[#0B1C2D] dark:text-[#E6ECF2] p-2 rounded-lg hover:bg-[#FCE8E7] dark:hover:bg-[#1B2F46] hover:scale-110 transition-all duration-200" onclick="toggleNavbar()" title="Fermer">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
          </button>
        </div>

        <!-- Boutons de navigation -->
        <div class="flex flex-col gap-2 px-3 py-2 border-b border-[#D8DEE6] dark:border-[#1F334A]">
          <button id="newConvNavBtn" class="flex items-center gap-2 p-2 rounded-lg hover:bg-[#FCE8E7] dark:hover:bg-[#1B2F46] transition-all duration-200 active:scale-95 text-[#E10600] dark:text-[#FF3B30] text-left text-sm font-semibold" onclick="createConversation()">
            <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
            <span class="whitespace-nowrap overflow-hidden" data-navbar-text>Nouvelle discussion</span>
          </button>
        </div>

        <!-- Section Historique -->
        <div class="flex flex-col flex-1 overflow-hidden px-3 py-4">
          <div class="flex items-center justify-between mb-3">
            <h3 class="text-xs font-bold text-[#0B1C2D] dark:text-[#E6ECF2] uppercase tracking-widest navbar-section-title" data-navbar-text>Historique</h3>
            <button id="historyToggleBtn" class="p-0.5 rounded hover:bg-[#FCE8E7] dark:hover:bg-[#1B2F46] transition-all duration-200 text-[#0B1C2D] dark:text-[#A5B2C3] hover:text-[#0B1C2D] dark:hover:text-[#E6ECF2]" title="Masquer l'historique" onclick="toggleHistoryList()" data-navbar-text>
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
            </button>
          </div>
          <div id="navbarHistoryList" class="flex-1 overflow-y-auto space-y-1">
            <p class="text-xs text-[#0d0737]/50 dark:text-white/50 text-center py-4">Aucune conversation</p>
          </div>
        </div>

        <!-- Bouton paramètres en bas -->
        <div class="px-3 py-4 border-t border-[#D8DEE6] dark:border-[#1F334A] bg-[#F5F6F8] dark:bg-[#13263B]">
          <button id="userProfileBtn" class="flex items-center gap-2 p-2 rounded-lg hover:bg-[#FCE8E7] dark:hover:bg-[#1B2F46] transition-all duration-200 active:scale-95 text-[#E10600] dark:text-[#FF3B30] w-full text-left text-sm font-semibold" onclick="openUserProfile()">
            <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
            <span class="whitespace-nowrap overflow-hidden" data-navbar-text>Paramètres</span>
          </button>
        </div>
      </nav>

      <!-- Overlay pour mobile -->
      <div id="navOverlay" class="fixed inset-0 bg-black/50 hidden z-30 lg:hidden" onclick="closeNavbar()"></div>

      <!-- Overlay pour l'historique -->
      <div id="historyOverlay" class="fixed inset-0 bg-black/50 hidden z-34" onclick="closeHistoryPanel()"></div>

      <!-- Zone de chat et historique -->
      <div id="chatContainer" class="flex-1 flex flex-col overflow-hidden relative">

        <!-- Messages -->
        <div id="chatBox" class="hidden overflow-y-auto p-6 space-y-4 flex-1">
        </div>

        <!-- Zone de saisie - Nouveau design -->
        <div id="inputContainer" class="flex flex-col items-center justify-center h-full px-4 py-8 bg-gradient-to-b from-[#F5F6F8] dark:from-[#050A10] to-[#EEF1F5] dark:to-[#13263B] transition-all duration-300">
          <h1 class="text-[#0B1C2D] dark:text-[#E6ECF2] text-4xl font-bold text-center mb-3">
            🏁 Bienvenue au Pit Stop 🏁
          </h1>
          <p class="text-[#4F647D] dark:text-[#A5B2C3] text-lg text-center mb-12">
            Votre assistant expert en <span style="background: linear-gradient(135deg, #e10600, #ff6b00); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">Formule 1</span> 🏎️
          </p>
          
          <div class="w-full max-w-2xl">
            <form id="chatForm" onsubmit="sendMessage(event)" class="flex items-center relative">
              <input
                type="text"
                id="messageInput"
                placeholder="pilotes, circuits, écuries, stratégies..."
                required
                autocomplete="off"
                class="input-racing"
              />
              
              <button type="submit" id="sendBtn" class="absolute right-3 p-2 rounded-full bg-[#EEF1F5] hover:bg-[#D8DEE6] text-[#0B1C2D] transition disabled:opacity-50" aria-label="Envoyer">
                <svg class="w-5 h-5 rotate-90" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
              </button>
            </form>
          </div>
        </div>
      </div>

        <!-- Panneau d'historique (coulissant par la droite) -->
        <aside id="historyPanel" class="fixed right-0 top-0 w-64 h-full border-l border-[#D8DEE6] dark:border-[#1F334A] bg-[#F5F6F8] dark:bg-[#0C1A28] flex flex-col shadow-lg hidden z-35 transition-transform duration-300 transform translate-x-full" aria-hidden="true">
          <div class="px-4 py-4 border-b border-[#D8DEE6] dark:border-[#1F334A] flex justify-between items-center bg-[#E10600] dark:bg-[#13263B]">
            <h3 class="font-semibold text-[#FFFFFF] dark:text-[#E6ECF2]">Historique</h3>
            <div class="relative group">
              <button id="closeHistoryBtn" class="p-1 rounded hover:bg-[#EEF1F5] dark:hover:bg-[#1B2F46] transition" onclick="closeHistoryPanel()">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
              </button>
              <div class="absolute left-10 top-1/2 -translate-y-1/2 bg-[#0B1C2D] dark:bg-[#13263B] text-white text-xs px-2 py-1 rounded whitespace-nowrap opacity-0 group-hover:opacity-100 transition pointer-events-none">Fermer</div>
            </div>
          </div>
          <div id="historyContent" class="flex-1 overflow-y-auto p-3 space-y-2">
            <p class="text-sm text-[#8A97A8] dark:text-[#6F8197]">Chargement...</p>
          </div>
        </aside>
      </div>
    </div>

    <!-- Overlay profil -->
    <div id="userProfileOverlay" class="fixed inset-0 bg-black/50 hidden z-40" onclick="closeUserProfile()"></div>
    
    <!-- Panneau profil utilisateur -->
    <div id="userProfilePanel" class="fixed top-0 right-0 w-96 h-full bg-[#F5F6F8] dark:bg-[#0C1A28] shadow-xl flex flex-col z-50 transform translate-x-full transition-transform" aria-hidden="true">
      <div class="px-6 py-4 border-b border-[#D8DEE6] dark:border-[#1F334A] flex justify-between items-center bg-[#E10600] dark:bg-[#13263B]">
        <h3 class="font-semibold text-[#FFFFFF] dark:text-[#E6ECF2]">Profil</h3>
        <div class="relative group">
          <button class="p-1 rounded hover:bg-[#EEF1F5] dark:hover:bg-[#1B2F46] transition" onclick="closeUserProfile()">
            <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
          </button>
          <div class="absolute right-8 top-1/2 -translate-y-1/2 bg-[#0B1C2D] dark:bg-[#13263B] text-[#FFFFFF] text-xs px-2 py-1 rounded whitespace-nowrap opacity-0 group-hover:opacity-100 transition pointer-events-none">Fermer</div>
        </div>
      </div>
      <div class="flex-1 overflow-y-auto p-6 space-y-6">
        <!-- Section apparence -->
        <div>
          <h4 class="font-semibold text-[#0B1C2D] dark:text-[#E6ECF2] mb-3">Apparence</h4>
          <label class="flex items-center gap-3 cursor-pointer">
            <input type="checkbox" id="darkModeToggle" class="w-4 h-4 rounded cursor-pointer" onchange="toggleDarkMode()">
            <span class="text-sm text-[#4F647D] dark:text-[#A5B2C3]">Mode sombre</span>
          </label>
        </div>

        <!-- Section données -->
        <div>
          <h4 class="font-semibold text-[#0B1C2D] dark:text-[#E6ECF2] mb-3">Données</h4>
          <button id="clearHistoryBtn" class="w-full px-4 py-2 rounded-lg bg-[#E10600] dark:bg-[#FF3B30] hover:bg-[#FF3B30] dark:hover:bg-[#E10600] text-white transition text-sm font-medium" onclick="clearAllHistory()">Supprimer tout l'historique</button>
        </div>
      </div>
    </div>

    <!-- Script client -->
    <script src="{{ url_for('static', path='js/app.js') }}"></script>
  </body>
</html>
