<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title or 'Chatbot Ollama' }}</title>
    <link rel="icon" type="image/png" href="/image/favicon.png?v={{ range(100000) | random }}">
    <!-- Tailwind CSS avec config sombre automatique -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class'
      }
    </script>
    <!-- Init dark mode before DOM renders -->
    <script>
      (function() {
        const savedDarkMode = localStorage.getItem("darkMode");
        const isDarkMode = savedDarkMode !== null ? savedDarkMode === "true" : true;
        localStorage.setItem("darkMode", isDarkMode);
        if (isDarkMode) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <style>
      #mainNavbar {
        transition: width 0.3s ease;
        width: 15rem;
      }
      
      #mainNavbar.navbar-collapsed {
        width: 4rem;
      }
      
      #mainNavbar.navbar-collapsed [data-navbar-text],
      #mainNavbar.navbar-collapsed .navbar-section-title {
        display: none;
      }
      
      #mainNavbar.navbar-collapsed .px-4,
      #mainNavbar.navbar-collapsed .px-3 {
        padding-left: 0.5rem;
        padding-right: 0.5rem;
      }
      
      #mainNavbar.navbar-collapsed button {
        justify-content: center;
      }
      
      [data-navbar-text] {
        transition: opacity 0.3s ease;
      }

      /* Header icons visibility */
      .navbar-logo {
        transition: opacity 0.3s ease;
      }

      .navbar-toggle-icon {
        opacity: 0;
        transition: opacity 0.3s ease;
      }

      /* Navbar OUVERTE (state par défaut) */
      /* F1 à gauche, icône à droite visible */
      #mainNavbar:not(.navbar-collapsed) > div:first-child {
        justify-content: space-between;
      }

      #mainNavbar:not(.navbar-collapsed) .navbar-logo {
        opacity: 1;
      }

      #mainNavbar:not(.navbar-collapsed) .navbar-toggle-icon {
        opacity: 1;
      }

      /* Navbar FERMÉE */
      /* F1 centré, icône remplace F1 au hover */
      #mainNavbar.navbar-collapsed > div:first-child {
        justify-content: center;
        position: relative;
      }

      #mainNavbar.navbar-collapsed .navbar-logo {
        opacity: 1;
        position: relative;
      }

      #mainNavbar.navbar-collapsed .navbar-toggle-icon {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
      }

      #mainNavbar.navbar-collapsed:hover .navbar-logo {
        opacity: 0;
      }

      #mainNavbar.navbar-collapsed:hover .navbar-toggle-icon {
        opacity: 1;
      }

      /* États du layout chat */
      #chatContainer.active-chat #chatBox {
        display: flex;
        flex-direction: column;
      }

      #chatContainer.active-chat #inputContainer {
        height: auto;
        padding: 1rem 1.5rem;
      }

      #chatContainer.active-chat #inputContainer h1 {
        display: none;
      }

      #chatContainer.active-chat #inputContainer > div {
        width: 100%;
        max-width: 100%;
      }

      @media (prefers-color-scheme: dark) {
        #chatContainer.active-chat #inputContainer {
          border-top-color: #1e293b;
        }
      }

      /* Décalage du chat container pour laisser place à la navbar */
      #chatContainer {
        margin-left: 15rem;
        transition: margin-left 0.3s ease;
      }

      #mainNavbar.navbar-collapsed ~ #chatContainer {
        margin-left: 4rem;
      }
    </style>
  </head>
  <body class="bg-[#e8d3d3] dark:bg-[#04031a] text-slate-900 dark:text-slate-100 h-screen overflow-hidden">
    <div class="flex h-full">
      <!-- Navbar collapsible -->
      <nav id="mainNavbar" class="bg-[#d0c0c0] dark:bg-[#1f1f2f] flex flex-col py-3 shadow-lg overflow-hidden fixed left-0 top-0 h-full z-50">
        <!-- Header avec emoji F1 et icone de controle -->
        <div class="px-4 py-3 flex items-center justify-between bg-[#d0c0c0] dark:bg-[#1f1f2f] relative">
          <!-- F1 logo - à gauche en ouvert, centré en fermé -->
          <button class="navbar-logo text-2xl hover:scale-110 transition-transform duration-200" title="Logo">🏎️</button>
          
          <!-- Icone toggle - à droite en ouvert, remplace F1 au hover en fermé -->
          <button class="navbar-toggle-icon items-center text-[#0d0737] dark:text-white p-2 rounded-lg hover:bg-[#c8afa0] dark:hover:bg-[#4a4d55] hover:scale-110 transition-all duration-200" onclick="toggleNavbar()" title="Fermer">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
          </button>
        </div>

        <!-- Boutons de navigation -->
        <div class="flex flex-col gap-2 px-3 py-4 border-b border-[#c8afa0] dark:border-[#4a4d55]">
          <button id="newConvNavBtn" class="flex items-center gap-2 p-2 rounded-lg hover:bg-[#c8afa0] dark:hover:bg-[#4a4d55] transition-all duration-200 active:scale-95 text-[#0d0737] dark:text-white text-left text-sm font-medium" onclick="createConversation()">
            <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
            <span class="whitespace-nowrap overflow-hidden" data-navbar-text>Nouvelle discussion</span>
          </button>
        </div>

        <!-- Section Historique -->
        <div class="flex flex-col flex-1 overflow-hidden px-3 py-4">
          <div class="flex items-center justify-between mb-3">
            <h3 class="text-xs font-bold text-[#0d0737] dark:text-white/80 uppercase tracking-widest navbar-section-title" data-navbar-text>Historique</h3>
            <button id="historyToggleBtn" class="p-0.5 rounded hover:bg-[#c8afa0] dark:hover:bg-[#363745] transition-all duration-200 text-[#0d0737] dark:text-white/70 hover:text-[#0d0737] dark:hover:text-white" title="Masquer l'historique" onclick="toggleHistoryList()" data-navbar-text>
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
            </button>
          </div>
          <div id="navbarHistoryList" class="flex-1 overflow-y-auto space-y-1">
            <p class="text-xs text-[#0d0737]/50 dark:text-white/50 text-center py-4">Aucune conversation</p>
          </div>
        </div>

        <!-- Bouton paramètres en bas -->
        <div class="px-3 py-4 border-t border-[#c8afa0] dark:border-[#4a4d55] bg-[#d0c0c0] dark:bg-[#363745]">
          <button id="userProfileBtn" class="flex items-center gap-2 p-2 rounded-lg hover:bg-[#c8afa0] dark:hover:bg-[#4a4d55] transition-all duration-200 active:scale-95 text-[#0d0737] dark:text-white w-full text-left text-sm font-medium" onclick="openUserProfile()">
            <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
            <span class="whitespace-nowrap overflow-hidden" data-navbar-text>Paramètres</span>
          </button>
        </div>
      </nav>

      <!-- Overlay pour mobile -->
      <div id="navOverlay" class="fixed inset-0 bg-black/50 hidden z-30 lg:hidden" onclick="closeNavbar()"></div>

      <!-- Overlay pour l'historique -->
      <div id="historyOverlay" class="fixed inset-0 bg-black/50 hidden z-34" onclick="closeHistoryPanel()"></div>

      <!-- Zone de chat et historique -->
      <div id="chatContainer" class="flex-1 flex flex-col overflow-hidden relative">

        <!-- Messages -->
        <div id="chatBox" class="hidden overflow-y-auto p-6 space-y-4 flex-1">
        </div>

        <!-- Zone de saisie - Nouveau design -->
        <div id="inputContainer" class="flex flex-col items-center justify-center h-full px-4 py-8 bg-gradient-to-b from-[#e8d3d3] dark:from-[#04031a] to-[#dcc9c9] dark:to-[#1f1f2f] transition-all duration-300">
          <h1 class="text-slate-900 dark:text-white text-3xl font-light text-center mb-12">
            Comment puis-je vous aider ?
          </h1>
          
          <div class="w-full max-w-2xl">
            <form id="chatForm" onsubmit="sendMessage(event)" class="bg-[#0d0737] dark:bg-[#9b473e] rounded-full shadow-2xl flex items-center px-6 py-4 border border-[#0d0737] dark:border-[#9b473e]">
              <input
                type="text"
                id="messageInput"
                placeholder="Poser une question"
                required
                autocomplete="off"
                class="flex-1 bg-[#0d0737] dark:bg-[#9b473e] text-white placeholder-slate-200 dark:placeholder-white outline-none text-base focus:outline-none"
              />
              
              <button type="submit" id="sendBtn" class="ml-3 p-2 rounded-full bg-white hover:bg-slate-200 dark:bg-white dark:hover:bg-slate-200 text-slate-900 transition disabled:opacity-50" aria-label="Envoyer">
                <svg class="w-5 h-5 rotate-90" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
              </button>
            </form>
          </div>
        </div>
      </div>

        <!-- Panneau d'historique (coulissant par la droite) -->
        <aside id="historyPanel" class="fixed right-0 top-0 w-64 h-full border-l border-slate-200 dark:border-[#363745] bg-white dark:bg-[#1f1f2f] flex flex-col shadow-lg hidden z-35 transition-transform duration-300 transform translate-x-full" aria-hidden="true">
          <div class="px-4 py-4 border-b border-slate-200 dark:border-[#363745] flex justify-between items-center bg-slate-50 dark:bg-[#363745]">
            <h3 class="font-semibold text-slate-900 dark:text-white">Historique</h3>
            <div class="relative group">
              <button id="closeHistoryBtn" class="p-1 rounded hover:bg-slate-200 dark:hover:bg-slate-700 transition" onclick="closeHistoryPanel()">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
              </button>
              <div class="absolute left-10 top-1/2 -translate-y-1/2 bg-slate-900 dark:bg-[#363745] text-white text-xs px-2 py-1 rounded whitespace-nowrap opacity-0 group-hover:opacity-100 transition pointer-events-none">Fermer</div>
            </div>
          </div>
          <div id="historyContent" class="flex-1 overflow-y-auto p-3 space-y-2">
            <p class="text-sm text-slate-500 dark:text-slate-400">Chargement...</p>
          </div>
        </aside>
      </div>
    </div>

    <!-- Overlay profil -->
    <div id="userProfileOverlay" class="fixed inset-0 bg-black/50 hidden z-40" onclick="closeUserProfile()"></div>
    
    <!-- Panneau profil utilisateur -->
    <div id="userProfilePanel" class="fixed top-0 right-0 w-96 h-full bg-white dark:bg-[#1f1f2f] shadow-xl flex flex-col z-50 transform translate-x-full transition-transform" aria-hidden="true">
      <div class="px-6 py-4 border-b border-slate-200 dark:border-[#363745] flex justify-between items-center bg-slate-50 dark:bg-[#363745]">
        <h3 class="font-semibold text-slate-900 dark:text-white">Profil</h3>
        <div class="relative group">
          <button class="p-1 rounded hover:bg-slate-200 dark:hover:bg-slate-700 transition" onclick="closeUserProfile()">
            <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
          </button>
          <div class="absolute right-8 top-1/2 -translate-y-1/2 bg-slate-900 dark:bg-[#363745] text-white text-xs px-2 py-1 rounded whitespace-nowrap opacity-0 group-hover:opacity-100 transition pointer-events-none">Fermer</div>
        </div>
      </div>
      <div class="flex-1 overflow-y-auto p-6 space-y-6">
        <!-- Section apparence -->
        <div>
          <h4 class="font-semibold text-slate-900 dark:text-white mb-3">Apparence</h4>
          <label class="flex items-center gap-3 cursor-pointer">
            <input type="checkbox" id="darkModeToggle" class="w-4 h-4 rounded cursor-pointer" onchange="toggleDarkMode()">
            <span class="text-sm text-slate-700 dark:text-slate-300">Mode sombre</span>
          </label>
        </div>

        <!-- Section données -->
        <div>
          <h4 class="font-semibold text-slate-900 dark:text-white mb-3">Données</h4>
          <button id="clearHistoryBtn" class="w-full px-4 py-2 rounded-lg bg-[#0d0737] dark:bg-[#9b473e] hover:bg-[#0d0737] dark:hover:bg-[#9b473e] text-white transition text-sm font-medium" onclick="clearAllHistory()">Supprimer tout l'historique</button>
        </div>
      </div>
    </div>

    <!-- Script client -->
    <script src="{{ url_for('static', path='js/app.js') }}"></script>
  </body>
</html>
