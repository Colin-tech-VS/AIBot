<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title or 'Chatbot Ollama' }}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}" />
  </head>
  <body>
    <div class="container">
      <!-- Navbar verticale sur la droite -->
      <nav class="navbar">
        <div class="navbar-brand">
          🏎️
        </div>
        <div class="navbar-buttons">
          <button id="newConvNavBtn" class="nav-icon-btn" aria-label="Nouvelle conversation" onclick="createConversation()">+</button>
          <button id="historyToggleBtn" class="nav-icon-btn" aria-label="Historique" onclick="toggleHistoryPanel()">☰</button>
        </div>
        <button id="userProfileBtn" class="nav-icon-btn user-profile-btn" aria-label="Profil utilisateur" onclick="openUserProfile()">⚙</button>
      </nav>

      <!-- Zone de chat et historique -->
      <div class="main-content">
        <!-- Zone de chat -->
        <div class="chat-container">
          <div id="chatBox" class="chat-box">
            <!-- Les messages s'ajoutent ici dynamiquement -->
            <div class="message-info">
              <p><strong>Connecté à Ollama</strong> (LLaMA2 | Mistral fallback)</p>
              <p>Posez une question F1 pour commencer...</p>
            </div>
          </div>

          <!-- Zone de saisie -->
          <div class="input-area">
            <form id="chatForm" onsubmit="sendMessage(event)">
              <div class="input-wrapper">
                <input
                  type="text"
                  id="messageInput"
                  placeholder="Ex: Qui a gagné le dernier GP?"
                  required
                  autocomplete="off"
                />
                <button type="submit" class="send-icon-btn" id="sendBtn" aria-label="Envoyer">
                  ➤
                </button>
              </div>
            </form>
          </div>
        </div>

        <!-- Panneau d'historique -->
        <aside id="historyPanel" class="history-panel-sidebar" aria-hidden="true">
          <div class="history-header">
            <h3>Conversations</h3>
            <div style="display:flex;gap:0.5rem;align-items:center;">
              <button id="newConversationBtn" class="history-header-btn" aria-label="Nouvelle conversation">+</button>
              <button id="closeHistoryBtn" class="history-header-btn" aria-label="Fermer" onclick="closeHistoryPanel()">✕</button>
            </div>
          </div>
          <div id="historyContent" class="history-content">
            <!-- La liste des conversations sera remplie ici -->
            <p class="muted">Chargement...</p>
          </div>
        </aside>
      </div>

    <!-- Panneau profil utilisateur -->
    <div id="userProfileOverlay" class="profile-overlay" onclick="closeUserProfile()" hidden></div>
    <div id="userProfilePanel" class="user-profile-panel" aria-hidden="true">
      <div class="profile-header">
        <h3>Profil</h3>
        <button class="profile-close-btn" aria-label="Fermer" onclick="closeUserProfile()">✕</button>
      </div>
      <div class="profile-content">
        <!-- Section utilisateur -->
        <div class="profile-section">
          <h4>Compte</h4>
          <div id="userInfo" class="user-info">
            <p class="muted">Non connecté</p>
            <button id="loginBtn" class="profile-btn" onclick="handleLogin()">Se connecter</button>
          </div>
        </div>

        <!-- Section apparence -->
        <div class="profile-section">
          <h4>Apparence</h4>
          <div class="theme-toggle">
            <label for="darkModeToggle" class="toggle-label">
              <input type="checkbox" id="darkModeToggle" class="toggle-input" onchange="toggleDarkMode()">
              <span class="toggle-switch"></span>
              <span class="toggle-text">Mode sombre</span>
            </label>
          </div>
        </div>
      </div>
    </div>

    <!-- Script client -->
    <script src="{{ url_for('static', path='js/app.js') }}"></script>
  </body>
</html>
