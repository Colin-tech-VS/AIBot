<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title or 'Chatbot Ollama' }}</title>
    <link rel="icon" type="image/png" href="/image/favicon.png?v=1">
    <!-- Tailwind CSS avec config sombre automatique -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class'
      }
    </script>
  </head>
  <body class="bg-white dark:bg-slate-950 text-slate-900 dark:text-slate-100 h-screen overflow-hidden">
    <div class="flex h-full">
      <!-- Navbar verticale -->
      <nav class="w-16 bg-red-900 dark:bg-red-950 border-r border-red-950 dark:border-black flex flex-col items-center py-4 shadow-sm gap-8">
        <div class="text-3xl">🏎️</div>
        <div class="flex flex-col gap-4">
          <div class="relative group">
            <button id="newConvNavBtn" class="p-2 rounded-lg hover:bg-red-800 dark:hover:bg-red-900 transition text-white" onclick="createConversation()">
              <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
            </button>
            <div class="absolute left-16 top-1/2 -translate-y-1/2 bg-slate-900 dark:bg-slate-700 text-white text-xs px-2 py-1 rounded whitespace-nowrap opacity-0 group-hover:opacity-100 transition pointer-events-none">Nouvelle discussion</div>
          </div>
          <div class="relative group">
            <button id="historyToggleBtn" class="p-2 rounded-lg hover:bg-red-800 dark:hover:bg-red-900 transition text-white" onclick="toggleHistoryPanel()">
              <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            </button>
            <div class="absolute left-16 top-1/2 -translate-y-1/2 bg-slate-900 dark:bg-slate-700 text-white text-xs px-2 py-1 rounded whitespace-nowrap opacity-0 group-hover:opacity-100 transition pointer-events-none">Conversations</div>
          </div>
        </div>
        <div class="relative group mt-auto">
          <button id="userProfileBtn" class="p-2 rounded-lg hover:bg-red-800 dark:hover:bg-red-900 transition text-white" onclick="openUserProfile()">
            <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
            </button>
          <div class="absolute left-16 top-1/2 -translate-y-1/2 bg-slate-900 dark:bg-slate-700 text-white text-xs px-2 py-1 rounded whitespace-nowrap opacity-0 group-hover:opacity-100 transition pointer-events-none">Paramètres</div>
        </div>
      </nav>

      <!-- Zone de chat et historique -->
      <div class="flex-1 flex overflow-hidden">
        <!-- Zone de chat -->
        <div class="flex-1 flex flex-col bg-white dark:bg-slate-950">
          <!-- Header avec titre -->
          <div class="px-6 py-4 border-b border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900">
            <h1 id="convTitleText" class="text-lg font-semibold text-slate-900 dark:text-white">Aucune conversation active</h1>
          </div>

          <!-- Messages -->
          <div id="chatBox" class="flex-1 overflow-y-auto p-6 space-y-4">
            <div class="text-center py-8">
              <p class="font-semibold text-slate-900 dark:text-white">Connecté à Ollama</p>
              <p class="text-sm text-slate-500 dark:text-slate-400">(LLaMA2 | Mistral fallback)</p>
              <p class="text-slate-600 dark:text-slate-300 mt-2">Posez une question F1 pour commencer...</p>
            </div>
          </div>

          <!-- Zone de saisie -->
          <div class="px-6 py-4 border-t border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900">
            <form id="chatForm" onsubmit="sendMessage(event)" class="flex gap-2">
              <input
                type="text"
                id="messageInput"
                placeholder="Ex: Qui a gagné le dernier GP?"
                required
                autocomplete="off"
                class="flex-1 px-4 py-2 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-red-900 focus:border-transparent"
              />
              <button type="submit" id="sendBtn" class="p-2 rounded-lg bg-red-900 hover:bg-red-800 text-white transition disabled:opacity-50" aria-label="Envoyer">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
              </button>
            </form>
          </div>
        </div>

        <!-- Panneau d'historique -->
        <aside id="historyPanel" class="w-64 border-l border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 flex flex-col shadow-lg hidden sm:flex" aria-hidden="true">
          <div class="px-4 py-4 border-b border-slate-200 dark:border-slate-700 flex justify-between items-center bg-slate-50 dark:bg-slate-800">
            <h3 class="font-semibold text-slate-900 dark:text-white">Conversations</h3>
            <div class="flex gap-2">
              <div class="relative group">
                <button id="newConversationBtn" class="p-1 rounded hover:bg-slate-200 dark:hover:bg-slate-700 transition" onclick="createConversation()">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                </button>
                <div class="absolute left-10 top-1/2 -translate-y-1/2 bg-slate-900 dark:bg-slate-700 text-white text-xs px-2 py-1 rounded whitespace-nowrap opacity-0 group-hover:opacity-100 transition pointer-events-none">Nouvelle discussion</div>
              </div>
              <div class="relative group">
                <button id="closeHistoryBtn" class="p-1 rounded hover:bg-slate-200 dark:hover:bg-slate-700 transition" onclick="closeHistoryPanel()">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
                <div class="absolute left-10 top-1/2 -translate-y-1/2 bg-slate-900 dark:bg-slate-700 text-white text-xs px-2 py-1 rounded whitespace-nowrap opacity-0 group-hover:opacity-100 transition pointer-events-none">Fermer</div>
              </div>
            </div>
          </div>
          <div id="historyContent" class="flex-1 overflow-y-auto p-3 space-y-2">
            <p class="text-sm text-slate-500 dark:text-slate-400">Chargement...</p>
          </div>
        </aside>
      </div>
    </div>

    <!-- Overlay profil -->
    <div id="userProfileOverlay" class="fixed inset-0 bg-black/50 hidden z-40" onclick="closeUserProfile()"></div>
    
    <!-- Panneau profil utilisateur -->
    <div id="userProfilePanel" class="fixed top-0 right-0 w-96 h-full bg-white dark:bg-slate-900 shadow-xl flex flex-col z-50 transform translate-x-full transition-transform" aria-hidden="true">
      <div class="px-6 py-4 border-b border-slate-200 dark:border-slate-700 flex justify-between items-center bg-slate-50 dark:bg-slate-800">
        <h3 class="font-semibold text-slate-900 dark:text-white">Profil</h3>
        <div class="relative group">
          <button class="p-1 rounded hover:bg-slate-200 dark:hover:bg-slate-700 transition" onclick="closeUserProfile()">
            <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
          </button>
          <div class="absolute right-8 top-1/2 -translate-y-1/2 bg-slate-900 dark:bg-slate-700 text-white text-xs px-2 py-1 rounded whitespace-nowrap opacity-0 group-hover:opacity-100 transition pointer-events-none">Fermer</div>
        </div>
      </div>
      <div class="flex-1 overflow-y-auto p-6 space-y-6">
        <!-- Section utilisateur -->
        <div>
          <h4 class="font-semibold text-slate-900 dark:text-white mb-3">Compte</h4>
          <div id="userInfo" class="space-y-2">
            <p class="text-sm text-slate-500 dark:text-slate-400">Non connecté</p>
            <button id="loginBtn" class="w-full px-4 py-2 rounded-lg bg-red-900 hover:bg-red-800 text-white transition text-sm font-medium" onclick="handleLogin()">Se connecter</button>
          </div>
        </div>

        <!-- Section apparence -->
        <div>
          <h4 class="font-semibold text-slate-900 dark:text-white mb-3">Apparence</h4>
          <label class="flex items-center gap-3 cursor-pointer">
            <input type="checkbox" id="darkModeToggle" class="w-4 h-4 rounded cursor-pointer" onchange="toggleDarkMode()">
            <span class="text-sm text-slate-700 dark:text-slate-300">Mode sombre</span>
          </label>
        </div>
      </div>
    </div>

    <!-- Script client -->
    <script src="{{ url_for('static', path='js/app.js') }}"></script>
  </body>
</html>
