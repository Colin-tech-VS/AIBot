<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title or 'Chatbot Ollama' }}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}" />
  </head>
  <body>
    <div class="container">
      <!-- Header -->
      <header class="header">
        <h1>🏎️ <strong>F1 AI Chatbot</strong> 🏁</h1>
        <!-- Subtitle removed per request -->
        <div id="convTitle" class="conv-title">
          <span id="convTitleText">Aucune conversation active</span>
        </div>
      </header>

      <!-- Zone de chat -->
      <div class="chat-container">
        <div id="chatBox" class="chat-box">
          <!-- Les messages s'ajoutent ici dynamiquement -->
          <div class="message-info">
            <p><strong>✅ Connecté à Ollama</strong> (LLaMA2 | Mistral fallback)</p>
            <p>🏎️ Posez une question F1 pour commencer...</p>
          </div>
        </div>

        <!-- Zone de saisie -->
        <div class="input-area">
          <form id="chatForm" onsubmit="sendMessage(event)">
            <div class="input-wrapper">
              <input
                type="text"
                id="messageInput"
                placeholder="🏁 Ex: Qui a gagné le dernier GP? 🏆"
                required
                autocomplete="off"
              />
              <button type="submit" class="send-btn" id="sendBtn">
                ▶️ Envoyer
              </button>
            </div>
          </form>
          <div style="display:flex;gap:0.5rem;flex-wrap:wrap;align-items:center;">
            <button class="clear-btn" onclick="clearChat()">
              🗑️ Effacer l'historique
            </button>
            <button type="button" class="clear-btn" id="openHistoryBtn" onclick="openHistoryPanel()">
              📚 Historique
            </button>
            <button type="button" class="clear-btn" id="quickNewConversationBtn">
              ➕ Nouvelle
            </button>
          </div>
        </div>
      </div>

      <!-- Footer -->
      <footer class="footer">
        <p><strong>F1 Chatbot</strong></p>
      </footer>
    </div>

    <!-- Panneau coulissant d'historique -->
    <div id="historyOverlay" class="history-overlay" onclick="closeHistoryPanel()" hidden></div>
    <aside id="historyPanel" class="history-panel" aria-hidden="true">
      <div class="history-header">
        <h3>Conversations</h3>
        <div style="display:flex;gap:0.5rem;align-items:center;">
          <button id="newConversationBtn" class="clear-btn">➕ Nouvelle</button>
          <button id="closeHistoryBtn" aria-label="Fermer" onclick="closeHistoryPanel()">✖</button>
        </div>
      </div>
      <div id="historyContent" class="history-content">
        <!-- La liste des conversations sera remplie ici -->
        <p class="muted">Chargement...</p>
      </div>
    </aside>

    <!-- Script client -->
    <script src="{{ url_for('static', path='js/app.js') }}"></script>
  </body>
</html>
